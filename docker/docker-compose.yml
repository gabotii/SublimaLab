# Local stack: PostgreSQL + API behind a TLS-terminating Caddy proxy.
#
#   cp docker/.env.example docker/.env      # then edit the values
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up --build
#
# API:      https://localhost:8443/api/products   (Caddy internal CA: trust it or use curl -k)
# Postgres: localhost:5432

name: sublimalab

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sublimalab
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    ports:
      - "5432:5432"
    networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sublimalab"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending migrations once, then exits; the API starts after it succeeds.
  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: migrations
    command: ["--connection", "Host=db;Port=5432;Database=sublimalab;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=sublimalab;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__Provider: Postgres
      Database__MigrateOnStartup: "false"
      Database__SeedOnStartup: "true"
      # Server-side prerendering calls the app on its own port.
      Prerendering__ApiBaseUrl: http://localhost:8080
      ReverseProxy__Enabled: "true"
      # Only Caddy, on the private network below, may set X-Forwarded-For / X-Forwarded-Proto.
      ReverseProxy__KnownNetworks__0: 172.28.0.0/24
      App__PublicBaseUrl: https://localhost:8443
      Email__Provider: Pickup
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      # Optional OpenTelemetry export (traces, metrics, logs); empty = off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - api-data:/app/App_Data
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"

  proxy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  db-data:
  api-data:
  caddy-data:
