<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    SublimaLab product artwork: the single source for product illustrations.
    Product bodies use currentColor, so the storefront tints them live (<use> + CSS color).
    Static images in /images/products are generated from these symbols by
    scripts/generate-product-images.ps1. Only solid fills (no gradients) so external <use> works everywhere.
  -->

  <symbol id="tshirt" viewBox="0 0 240 240">
    <path d="M80 30 60 38 22 62 39 101 63 91V214H177V91l24 10 17-39-38-24-20-8c-8 14-22 22-40 22S88 44 80 30Z" fill="currentColor" stroke="#0f172a" stroke-opacity=".16" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M63 91 63 214H74V95ZM177 91V214H166V95Z" fill="#0f172a" opacity=".05"/>
    <path d="M80 30c8 14 22 22 40 22s32-8 40-22" fill="none" stroke="#0f172a" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
    <path d="M39 101 22 62M201 101l17-39" stroke="#0f172a" stroke-opacity=".08" stroke-width="10" stroke-linecap="round"/>
    <g>
      <circle cx="112" cy="112" r="28" fill="#7c3aed"/>
      <circle cx="134" cy="126" r="20" fill="#06b6d4" opacity=".92"/>
      <circle cx="104" cy="136" r="11" fill="#ec4899"/>
      <path d="M140 92l3.5 7 7.5 1-5.5 5 1.5 7.5-7-3.6-7 3.6 1.5-7.5-5.5-5 7.5-1Z" fill="#f97316"/>
      <rect x="92" y="158" width="56" height="7" rx="3.5" fill="#d946ef"/>
      <rect x="100" y="170" width="40" height="6" rx="3" fill="#06b6d4" opacity=".8"/>
    </g>
  </symbol>

  <symbol id="mug" viewBox="0 0 240 240">
    <path d="M174 86c34 0 34 74 0 74" fill="none" stroke="#0f172a" stroke-opacity=".16" stroke-width="22" stroke-linecap="round"/>
    <path d="M174 86c34 0 34 74 0 74" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
    <rect x="46" y="54" width="132" height="150" rx="16" fill="currentColor" stroke="#0f172a" stroke-opacity=".16" stroke-width="2.5"/>
    <rect x="46" y="54" width="132" height="14" rx="7" fill="#0f172a" opacity=".07"/>
    <rect x="46" y="190" width="132" height="14" rx="7" fill="#0f172a" opacity=".05"/>
    <g>
      <rect x="62" y="88" width="100" height="84" rx="12" fill="#f5f3ff"/>
      <circle cx="96" cy="122" r="20" fill="#7c3aed"/>
      <circle cx="122" cy="134" r="15" fill="#06b6d4" opacity=".92"/>
      <circle cx="140" cy="108" r="9" fill="#ec4899"/>
      <rect x="76" y="154" width="72" height="7" rx="3.5" fill="#f97316"/>
    </g>
  </symbol>

  <symbol id="keychain-rect" viewBox="0 0 240 240">
    <circle cx="120" cy="30" r="16" fill="none" stroke="#9aa3b2" stroke-width="5"/>
    <rect x="114" y="44" width="12" height="22" rx="6" fill="#9aa3b2"/>
    <rect x="72" y="60" width="96" height="148" rx="18" fill="currentColor" stroke="#0f172a" stroke-opacity=".18" stroke-width="2.5"/>
    <circle cx="120" cy="74" r="5" fill="#fff" stroke="#0f172a" stroke-opacity=".2"/>
    <g>
      <circle cx="110" cy="128" r="24" fill="#7c3aed"/>
      <circle cx="132" cy="144" r="16" fill="#06b6d4" opacity=".92"/>
      <circle cx="104" cy="156" r="9" fill="#ec4899"/>
      <rect x="92" y="180" width="56" height="7" rx="3.5" fill="#f97316"/>
    </g>
    <path d="M80 70h18v128h-8a10 10 0 0 1-10-10Z" fill="#fff" opacity=".22"/>
  </symbol>

  <symbol id="keychain-square" viewBox="0 0 240 240">
    <circle cx="120" cy="34" r="16" fill="none" stroke="#9aa3b2" stroke-width="5"/>
    <rect x="114" y="48" width="12" height="22" rx="6" fill="#9aa3b2"/>
    <rect x="58" y="66" width="124" height="124" rx="20" fill="currentColor" stroke="#0f172a" stroke-opacity=".18" stroke-width="2.5"/>
    <circle cx="120" cy="80" r="5" fill="#fff" stroke="#0f172a" stroke-opacity=".2"/>
    <g>
      <circle cx="108" cy="126" r="24" fill="#7c3aed"/>
      <circle cx="132" cy="140" r="16" fill="#06b6d4" opacity=".92"/>
      <circle cx="146" cy="108" r="8" fill="#ec4899"/>
      <rect x="86" y="164" width="68" height="7" rx="3.5" fill="#f97316"/>
