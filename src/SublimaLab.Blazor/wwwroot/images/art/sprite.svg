    <rect x="114" y="44" width="12" height="22" rx="6" fill="#9aa3b2"/>
    <circle cx="120" cy="138" r="72" fill="currentColor" stroke="#0f172a" stroke-opacity=".18" stroke-width="2.5"/>
    <circle cx="120" cy="80" r="5" fill="#fff" stroke="#0f172a" stroke-opacity=".2"/>
    <g>
      <circle cx="110" cy="130" r="26" fill="#7c3aed"/>
      <circle cx="134" cy="146" r="17" fill="#06b6d4" opacity=".92"/>
      <circle cx="102" cy="160" r="9" fill="#ec4899"/>
      <path d="M146 104l3 6 6.5 1-4.7 4.4 1.2 6.4-6-3.2-6 3.2 1.2-6.4-4.7-4.4 6.5-1Z" fill="#f97316"/>
      <rect x="96" y="184" width="48" height="6" rx="3" fill="#d946ef"/>
    </g>
  </symbol>
</svg>
